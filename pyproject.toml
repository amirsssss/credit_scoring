[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "creditscoring"
version = "0.1.0"
description = "Credit scoring from telco CDR, app-usage and package-purchase data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "optbinning>=0.19",
    "lightgbm>=4.0",
    "shap>=0.44",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jupyterlab>=4", "nbstripout>=0.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
